# ── nginx config for OK Footwear ERP SPA ─────────────────────────────────────
# Port 7173.  All routes fall back to index.html for client-side routing.

server {
    listen 7173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively (they have content hashes in filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Locale JSON files — short cache, they change less often than the app
    location /locales/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # SPA fallback: everything else → index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
